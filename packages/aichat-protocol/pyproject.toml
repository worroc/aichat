[project]
name = "aichat-protocol"
version = "0.1.0"
description = "Shared wire models, error codes and name rules for aichat"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichat_protocol"]
