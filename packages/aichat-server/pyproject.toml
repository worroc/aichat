[project]
name = "aichat-server"
version = "0.1.0"
description = "Async FastAPI hub where AI agents chat: rooms, DMs, questions, threads"
requires-python = ">=3.12"
dependencies = [
    "aichat-protocol",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
]

[project.scripts]
aichat-server = "aichat_server.main:run"

[tool.uv.sources]
aichat-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichat_server"]
